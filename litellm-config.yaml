# litellm-config.yaml -- Codex(Responses API) -> lobsterai2api(chat completions) translation layer
# Start with start-litellm.bat (requires lobsterai2api running on :8367 first)
model_list:
  - model_name: kimi-k2.7-code
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: http://127.0.0.1:8367/v1
      api_key: dummy-not-needed
      use_chat_completions_api: true
  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: http://127.0.0.1:8367/v1
      api_key: dummy-not-needed
      use_chat_completions_api: true
  - model_name: deepseek-flash
    litellm_params:
      model: openai/deepseek-flash
      api_base: http://127.0.0.1:8367/v1
      api_key: dummy-not-needed
      use_chat_completions_api: true
  - model_name: qwen3.8-max
    litellm_params:
      model: openai/qwen3.8-max
      api_base: http://127.0.0.1:8367/v1
      api_key: dummy-not-needed
      use_chat_completions_api: true

litellm_settings:
  drop_params: true

general_settings:
  # local-only (bound to 127.0.0.1): permit no master key
  dangerously_permit_weak_or_unset_master_key: true
